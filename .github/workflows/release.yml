name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/veyro-debloat-engine.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyro-debloat-engine
          path: dist/veyro-debloat-engine.apk

      # NOTE: releases are created manually by uploading the locally-built,
      # locally-signed APK (CI debug-key APKs would break update-over-install
      # signature matching for existing users).
